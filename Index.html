<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oak</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M5 13.5C5 8.8 9.9 5 16 5s11 3.8 11 8.5c0 .8-.7 1.5-1.5 1.5h-19C5.7 15 5 14.3 5 13.5z%27 fill=%27%23141416%27/%3E%3Cpath d=%27M16 5V2.5%27 stroke=%27%23141416%27 stroke-width=%272.2%27 stroke-linecap=%27round%27/%3E%3Cpath d=%27M7.5 17h17c0 6-3.8 11.5-8.5 11.5S7.5 23 7.5 17z%27 fill=%27%2322C55E%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --canvas:#F6F6F7; --raised:#FFFFFF; --hover:#F2F2F4; --press:#EBEBEE;
  --line:#EAEAED; --line-2:#DCDCE0;
  --text:#141416; --text-2:#5C5C66; --text-3:#9898A2;
  --accent:#15803D; --accent-soft:#EAF7EE; --on-accent:#FFFFFF;
  --miss:#141416; --miss-soft:#EFEFF2; --miss-line:#C8C8CF; --miss-dot:#9A9AA4;
  --done:#15803D; --done-soft:#EAF7EE; --done-dot:#22C55E;
  --danger:#C2341F;
  --shadow:0 1px 2px rgba(20,20,22,.04),0 8px 24px rgba(20,20,22,.08);
  --shadow-lg:0 2px 6px rgba(20,20,22,.05),0 24px 64px rgba(20,20,22,.16);
  --font:'Geist','Noto Sans Hebrew',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#121214; --canvas:#0D0D0F; --raised:#18181B; --hover:#1E1E22; --press:#26262B;
  --line:#26262B; --line-2:#33333A;
  --text:#EDEDF0; --text-2:#A1A1AA; --text-3:#6B6B75;
  --accent:#4ADE80; --accent-soft:#0F2417; --on-accent:#0D0D0F;
  --miss:#EDEDF0; --miss-soft:#26262B; --miss-line:#44444C; --miss-dot:#6B6B75;
  --done:#4ADE80; --done-soft:#0F2417; --done-dot:#22C55E; --danger:#F87171;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 24px 64px rgba(0,0,0,.55);
}
@media (prefers-color-scheme:dark){:root[data-theme="system"]{color-scheme:dark;
  --bg:#121214; --canvas:#0D0D0F; --raised:#18181B; --hover:#1E1E22; --press:#26262B;
  --line:#26262B; --line-2:#33333A;
  --text:#EDEDF0; --text-2:#A1A1AA; --text-3:#6B6B75;
  --accent:#4ADE80; --accent-soft:#0F2417; --on-accent:#0D0D0F;
  --miss:#EDEDF0; --miss-soft:#26262B; --miss-line:#44444C; --miss-dot:#6B6B75;
  --done:#4ADE80; --done-soft:#0F2417; --done-dot:#22C55E; --danger:#F87171;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 24px 64px rgba(0,0,0,.55);
}}
.theme{display:inline-flex;background:var(--canvas);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.theme button{border:0;background:none;width:28px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--text-3)}
.theme button:hover{color:var(--text)}
.theme button[aria-pressed="true"]{background:var(--raised);color:var(--text);box-shadow:0 1px 2px rgba(20,20,22,.08),0 0 0 1px var(--line)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:400 14px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{flex:none}
.muted{color:var(--text-3)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--raised);font-weight:500;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover)}
.btn:active{background:var(--press)}
.btn.primary{background:var(--text);border-color:var(--text);color:var(--bg)}
.btn.primary:hover{opacity:.88;background:var(--text)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
kbd{font:500 11px var(--font);color:var(--text-3);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;line-height:17px}

/* top bar */
.top{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:10px;padding:0 24px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:-.02em}
.leaf .cap{fill:var(--text)}.leaf .stem{stroke:var(--text)}.leaf .nut{fill:var(--done-dot)}
.crumb{color:var(--text-3);font-size:13px;display:flex;align-items:center;gap:8px;margin-right:auto}
.crumb a{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);text-decoration:none;padding:4px 8px;border-radius:6px;max-width:220px}
.crumb a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb a:hover{background:var(--hover);color:var(--text)}
.search{position:relative;display:flex;align-items:center}
.search input{height:32px;width:280px;border:1px solid var(--line);border-radius:8px;padding:0 44px 0 32px;background:var(--canvas);transition:border-color .12s,background .12s,width .2s}
.search input:focus{outline:none;border-color:var(--accent);background:var(--raised);width:340px}
.search svg{position:absolute;left:10px;color:var(--text-3);pointer-events:none}
.search kbd{position:absolute;right:9px;pointer-events:none}
.me{border:0;background:none;padding:0;border-radius:50%;display:flex}
.me .av{width:28px;height:28px;font-size:11px}

/* month strip */
.page{max-width:1360px;margin:0 auto;padding:0 24px 140px}
.strip{display:flex;align-items:center;gap:4px;padding:20px 2px 2px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.mo{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 8px 0 13px;border:1px solid transparent;border-radius:17px;background:none;color:var(--text-2);font-size:13px;font-weight:500;white-space:nowrap;transition:background .12s,color .12s}
.mo:hover{background:var(--hover);color:var(--text)}
.mo[aria-current="true"]{background:var(--text);color:var(--bg)}
.mo .badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--miss-soft);color:var(--miss)}
.mo .badge.ok{background:var(--done-soft);color:var(--done);padding:0;width:20px}
.mo .badge.ok svg{width:12px;height:12px}
.mo > svg{margin-left:-2px;opacity:.6}
.mo[aria-current="true"] .badge.ok{background:color-mix(in srgb,var(--bg) 20%,transparent);color:var(--bg)}
.mo[aria-current="true"] .badge:not(.ok){background:var(--bg);color:var(--text)}
.strip .gap{flex:none;width:1px;height:20px;background:var(--line);margin:0 6px}
/* heading */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:28px 0 20px;border-bottom:1px solid var(--line)}
.head h1{font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-.035em;margin:0 0 8px}
.head p{margin:0;color:var(--text-2)}
.progress{display:inline-flex;align-items:center;gap:10px}
.ring{--p:0;width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--done-dot) calc(var(--p)*1%),var(--line-2) 0);-webkit-mask:radial-gradient(circle 5px,transparent 98%,#000);mask:radial-gradient(circle 5px,transparent 98%,#000)}
.sums{display:flex;gap:32px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12px;color:var(--text-3)}
.stat strong{font-size:17px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat strong.miss{color:var(--miss)}

/* toolbar */
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 0}
.tools .add-row{margin-left:auto}
.c.invno{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.copy-no{font:inherit;color:var(--text-2);background:none;border:0;padding:2px 4px;margin:0 -4px;border-radius:5px;cursor:copy}
.copy-no:hover{background:var(--line);color:var(--text)}
.inv-edit{font:inherit;background:none;border:0;padding:0;color:var(--accent);cursor:pointer}
.inv-edit:hover{text-decoration:underline}
.inv-no-edit{display:flex;gap:6px;margin:6px 0 4px}
.inv-no-edit input{flex:1;min-width:0;height:32px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;background:var(--raised);color:inherit;font:inherit}
.files .inv-no .copy-no{font-size:15px;font-weight:600;color:var(--text);background:var(--accent-soft);padding:3px 8px;margin:0;border-radius:6px;letter-spacing:.01em}
.files .inv-no .copy-no:hover{background:var(--line)}
.files .inv-no{display:flex;align-items:center;gap:8px;margin:8px 0 6px;color:var(--text-3)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.field select{width:100%;height:38px;border:1px solid var(--line-2);border-radius:9px;padding:0 10px;background:var(--raised);color:inherit;font:inherit}
.field .opt{font-weight:400;color:var(--text-3)}
.seg{display:inline-flex;gap:2px;background:var(--canvas);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;height:26px;padding:0 10px;border-radius:7px;color:var(--text-2);font-weight:500;font-size:13px;display:flex;gap:6px;align-items:center}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text);box-shadow:0 1px 2px rgba(20,20,22,.08),0 0 0 1px var(--line)}
.seg .n{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.vr{width:1px;height:20px;background:var(--line);margin:0 4px}
.chips{display:contents}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:none;color:var(--text-2);font-size:13px;font-weight:500}
.chip:hover{background:var(--hover);color:var(--text)}
.chip.on{background:var(--accent-soft);color:var(--accent)}
.chip.on b{font-weight:600;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toggle{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:0;background:none;color:var(--text-2);font-weight:500;font-size:13px}
.toggle:hover{background:var(--hover);color:var(--text)}
.toggle[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.clear{border:0;background:none;color:var(--text-3);font-size:13px;padding:0 6px;height:30px;border-radius:8px}
.clear:hover{color:var(--text);background:var(--hover)}

/* table */
.table{border-top:1px solid var(--line)}
.tr{display:grid;grid-template-columns:var(--grid,40px 74px minmax(160px,1.5fr) 104px 100px minmax(90px,.8fr) 140px minmax(120px,1.3fr) minmax(150px,1fr) 156px);align-items:center;min-height:48px;border-bottom:1px solid var(--line);position:relative}
.tr.th{min-height:36px;font-size:12px;color:var(--text-3);font-weight:500;position:sticky;top:56px;z-index:5;background:var(--bg)}
.c{padding:0 10px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c.r{text-align:right}
.c[dir="auto"]{text-align:left;unicode-bidi:plaintext}
.th .c{display:flex;align-items:center;gap:4px}
.th .c.r{justify-content:flex-end}
.sort{border:0;background:none;padding:0;color:inherit;font-weight:500;display:inline-flex;gap:3px;align-items:center}
.sort:hover,.sort[data-on]{color:var(--text)}
.tr:not(.th){transition:background .1s}
.tr:not(.th):hover{background:var(--canvas)}
.tr:not(.th)::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--miss-dot);opacity:0}
.tr.is-miss::before{opacity:1}
.tr.selected{background:var(--accent-soft)!important}
.date{color:var(--text-2);font-variant-numeric:tabular-nums}
.vendor .open{border:0;background:none;padding:0;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:start}
.vendor .open:hover{color:var(--accent)}
.amt{font-weight:500}
.note{color:var(--text-2)}
.cb{appearance:none;flex:none;width:16px;height:16px;border:1.5px solid var(--line-2);border-radius:4px;margin:0 0 0 14px;display:grid;place-items:center;background:var(--raised);cursor:pointer;transition:background .1s,border-color .1s}
.cb:hover{border-color:var(--text-3)}
.cb:checked{background:var(--accent);border-color:var(--accent)}
.cb:checked::after{content:"";width:8px;height:4px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.who{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:3px 8px 3px 3px;border-radius:14px;max-width:100%;color:var(--text-2);font-size:13px}
.who:hover{background:var(--hover);color:var(--text)}
.who span{overflow:hidden;text-overflow:ellipsis}
.who.none{color:var(--text-3)}
.tr:not(:hover) .who.none span{opacity:0}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600;color:#fff;flex:none}
.av.empty{background:transparent;border:1.5px dashed var(--line-2);color:var(--text-3);font-weight:400}
.inv{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s}
.inv.missing{border:1px dashed var(--miss-line);background:transparent;color:var(--miss)}
.inv.missing:hover{background:var(--miss-soft);border-style:solid}
.inv.done{background:var(--done-soft);color:var(--done);border:1px solid transparent}
.inv.lost{background:transparent;color:var(--text-2);border:1px solid var(--line-2)}
.pill.lost{color:var(--text-2);background:var(--line)}
.files .gone-note{display:block}
a.inv.done:hover{border-color:currentColor}
.inv.again{border:1px solid var(--text);background:var(--raised);color:var(--text)}
.inv.again:hover{background:var(--hover)}
.preview{margin:10px 0 4px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--canvas)}
.preview iframe{display:block;width:100%;height:380px;border:0;background:var(--canvas)}
.preview-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--text-2);background:var(--raised)}
.preview-bar > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-bar > span:last-child{display:flex;gap:2px;flex:none}
.preview-bar .btn{height:28px;font-size:12px;text-decoration:none}
.modal:has(.big-preview){width:min(1000px,100%)}
.big-preview iframe{display:block;width:100%;height:78vh;border:0}
.again-box{border:1px solid var(--line-2);border-left:3px solid var(--text);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.again-box strong{display:flex;align-items:center;gap:6px;font-size:13px}
.again-box p{margin:4px 0 0;color:var(--text-2)}
.files li.rejected > div > a,.files li.rejected > div > span{text-decoration:line-through;color:var(--text-3)}
.rej{color:var(--danger)}
.again-form{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--canvas)}
.again-form label{display:block;font-weight:600;font-size:13px;margin-bottom:8px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.qchip{border:1px solid var(--line-2);background:var(--raised);border-radius:14px;padding:4px 10px;font-size:12px;color:var(--text-2)}
.qchip:hover{border-color:var(--text);color:var(--text)}
.req-note p b{font-weight:600}
.drophint{display:none;font-size:13px;font-weight:600;color:var(--accent)}
.tr.drop-target{background:var(--accent-soft)!important;box-shadow:inset 0 0 0 1.5px var(--accent)}
.tr.drop-target .inv{display:none}
.tr.drop-target .drophint{display:inline}
.tr.just-done{animation:wash 1.4s ease-out}
.tr.just-done .inv.done{animation:stamp .5s cubic-bezier(.2,.9,.3,1.25)}
@keyframes stamp{0%{transform:scale(1.6) rotate(-8deg);opacity:0}60%{transform:scale(.95);opacity:1}100%{transform:none}}
@keyframes wash{0%{background:var(--done-soft)}100%{background:transparent}}
.empty-state{padding:72px 24px;text-align:center;color:var(--text-2)}
.empty-state h3{margin:0 0 6px;color:var(--text);font-weight:600;font-size:17px;letter-spacing:-.01em}
.empty-state p{margin:0 0 18px}

/* selection bar */
.selbar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);border-radius:12px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:4px;box-shadow:var(--shadow-lg);z-index:30;animation:rise .18s ease-out}
@keyframes rise{from{transform:translate(-50%,10px);opacity:0}}
.selbar .btn{background:transparent;border-color:transparent;color:inherit;height:32px}
.selbar .btn:hover{background:color-mix(in srgb,var(--bg) 14%,transparent)}
.selbar strong{font-weight:600;margin-right:10px;font-variant-numeric:tabular-nums;font-size:13px}
.selbar strong span{opacity:.6;font-weight:400;margin-left:6px}

/* pane */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.12);z-index:40}
.pane{position:fixed;top:8px;right:8px;bottom:8px;width:min(460px,calc(100vw - 16px));background:var(--raised);border:1px solid var(--line);border-radius:14px;z-index:41;overflow:auto;padding:16px 24px 40px;box-shadow:var(--shadow-lg)}
.pane.enter{animation:slide .2s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(16px);opacity:0}}
.pane-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--text-3);font-size:13px}
.pane h2{font-size:24px;font-weight:600;letter-spacing:-.025em;margin:0 0 4px;line-height:1.2;word-break:break-word}
.pane .sub{color:var(--text-2);margin:0 0 20px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;margin:0 0 24px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts dt{font-size:12px;color:var(--text-3);margin-bottom:3px}
.facts dd{margin:0;font-weight:500;word-break:break-word}
.pane section{margin-bottom:28px}
.pane h3{font-size:13px;font-weight:600;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.files{list-style:none;margin:0 0 10px;padding:0}
.files li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.files a{font-weight:500;text-decoration:none;word-break:break-all}
.files a:hover{color:var(--accent)}
.files small{display:block;color:var(--text-3);font-size:12px}
.files li > div{flex:1;min-width:0}
.dropzone{border:1.5px dashed var(--line-2);border-radius:12px;padding:22px;text-align:center;color:var(--text-2);transition:background .12s,border-color .12s}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone button{border:0;background:none;padding:0;color:var(--accent);font-weight:500}
.status-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px 2px 8px;border-radius:12px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.missing{background:var(--miss-soft);color:var(--miss)}
.pill.done{background:var(--done-soft);color:var(--done)}
.notes{list-style:none;margin:0 0 12px;padding:0}
.notes li{padding:10px 0;border-bottom:1px solid var(--line)}
.notes p{margin:0 0 3px;white-space:pre-wrap;word-break:break-word}
.notes small{color:var(--text-3);font-size:12px}

 .sheets-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}

/* setup */
.setup{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--canvas)}

/* drag dock + toast */
.dock{position:fixed;left:50%;bottom:24px;transform:translate(-50%,160%);width:min(480px,calc(100vw - 32px));background:var(--raised);border:1.5px dashed var(--line-2);border-radius:14px;padding:18px;text-align:center;z-index:50;transition:transform .22s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg)}

.w-top{display:flex;justify-content:space-between;gap:16px}
.w-pct{color:var(--text-3);font-variant-numeric:tabular-nums}
.w-bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}

#working.indet .w-bar i{width:30%;animation:indet 1.2s ease-in-out infinite}
@keyframes indet{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:90;max-width:min(460px,calc(100vw - 32px));box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;animation:rise .18s ease-out}
.toast.bad{background:var(--danger);color:#fff}

.demo{background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:500;text-align:center;padding:6px 12px}
.loading{display:grid;place-items:center;min-height:100vh;color:var(--text-3)}


/* login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);background:var(--bg)}

.login h1{font-size:44px;line-height:1.05;letter-spacing:-.045em;font-weight:600;margin:0 0 16px}

.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;height:46px;width:100%;max-width:340px;border-radius:10px;border:1px solid var(--line-2);background:var(--raised);font-weight:500;font-size:15px;text-decoration:none;color:var(--text);transition:background .12s,box-shadow .12s;box-shadow:0 1px 2px rgba(20,20,22,.05)}

.mrow .m{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .a{font-variant-numeric:tabular-nums;color:var(--text-2)}
.mrow .inv{height:24px;font-size:12px;padding:0 8px}

@media (max-width:1180px){

}

/* motion */
@property --p{syntax:'<number>';inherits:false;initial-value:0}

.spin{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}

.mrow .inv{transition:background .3s,color .3s,border-color .3s}

<script>
/* ================= theme: light (default), dark, or follow the computer ================= */
const THEMES = ['light', 'dark', 'system'];
function getTheme(){ try { const t = localStorage.getItem('oak-theme'); return THEMES.includes(t) ? t : 'light'; } catch (e) { return 'light'; } }
function setTheme(t){ document.documentElement.dataset.theme = t; try { localStorage.setItem('oak-theme', t); } catch (e) {} }
document.documentElement.dataset.theme = getTheme();

/* ================= backend bridge ================= */
const LIVE = typeof google !== 'undefined' && google.script && google.script.run;
function call(name, ...args){
  if (!LIVE) return Demo[name](...args);
  return new Promise((res, rej) => google.script.run
    .withSuccessHandler(res)
    .withFailureHandler(e => rej(new Error((e && e.message) || String(e))))[name](...args));

const LIBS = {xlsx:'https:\/\/cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'};
function lib(name){

}
window.addEventListener('error', e => showFatal(e.message || 'Unknown error'));

function money(n, cur){

  return SYM[cur] ? SYM[cur] + s : (cur ? s + ' ' + cur : s);

function fmtMonth(m){

}
function fmtDate(d, long){
  const x = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');

}

const isDone = r => r.status === 'Done' || r.status === 'Lost';
const isLost = r => r.status === 'Lost';
/* The latest "request again" note, if the charge is waiting for a better file. */
const reRequest = r => { if (isDone(r)) return null; const n = r.notes.filter(x => x.kind === 'request').pop(); const f = r.files.filter(x => !x.rejected).length; return n && !f ? n : null; };
function months(){
  const m = {};
  S.rows.forEach(r => { (m[r.month] = m[r.month] || {total:0, missing:0}); m[r.month].total++; if (!isDone(r)) m[r.month].missing++; });
  return Object.keys(m).sort().reverse().map(k => ({key:k, ...m[k]}));
}
const inMonth = () => S.rows.filter(r => S.month === 'all' || r.month === S.month);
function passFilters(r, skip){
  if (S.mine && r.owner !== S.user) return false;
  for (const f of FILTERS) {
    if (f.key === skip) continue;
    const set = S.f[f.key];
    if (set.size && !set.has(r[f.key] || '')) return false;
  }
  const q = S.q.trim().toLowerCase();
  if (q) {
    const hay = [r.merchant, r.details, r.owner, person(r.owner), r.files.map(f => f.invoiceNo).join(' '), r.amount, r.charged, money(r.amount, r.currency),
      ...r.notes.map(n => n.text), ...Object.values(r.extra || {})].join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function visible(){
  const k = S.sort.key, d = S.sort.dir;
  return inMonth()
    .filter(r => passFilters(r))
    .filter(r => S.status === 'all' || (S.status === 'missing' ? !isDone(r) : S.status === 'lost' ? isLost(r) : r.status === 'Done'))
    .sort((a, b) => {
      let x = a[k], y = b[k];
      if (k === 'amount') { x = +a.charged || +a.amount || 0; y = +b.charged || +b.amount || 0; }
      if (k === 'owner') { x = person(x); y = person(y); }
      if (x == null) x = ''; if (y == null) y = '';
      return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * d || String(b.date).localeCompare(String(a.date));
    });
}
function people(){
  const set = new Set([S.user, ...(S.team || [])]);

}

function rowHtml(r){
  const done = isDone(r);

  const live = r.files.filter(f => !f.rejected), f0 = live[0] || r.files[0];
  const tag = live.length > 1 ? live.length + ' files' : 'Invoice';
  const inv = S.busy.has(r.id) ? `<span class="inv busy"><span class="spin"></span>Uploading</span>`

    : done && live.length && live.every(f => f.gone) ? `<span class="inv done" title="Removed from the Drive folder">${I.check}${tag}</span>`
    : done
    ? (f0 && f0.url ? `<a class="inv done" href="${esc(f0.url)}" target="_blank" rel="noopener" title="${esc(f0.name)}">${I.check}${tag}</a>`
                    : `<span class="inv done">${I.check}${f0 ? tag : 'Done'}</span>`)

/* ---------- layer: pane, popover, modal, selection bar ---------- */

  const r = S.open && S.rows.find(x => x.id === S.open);

  if (S.sel.size) h += `<div class="selbar" role="toolbar" aria-label="Selected charges"><strong>${S.sel.size} selected <span style="opacity:.7;font-weight:400">${sumBy(S.rows.filter(r => S.sel.has(r.id)))}</span></strong>
      <button class="btn" data-act="assign-many">${I.person}Assign</button>
      <button class="btn" data-act="many-done">Mark done</button>
      <button class="btn" data-act="many-missing">Mark missing</button>
      <button class="btn" data-act="many-lost">Mark lost</button>
      <button class="btn" data-act="sel-clear" aria-label="Clear selection">${I.x}</button></div>`;

}

/* Inline preview of the chosen file, using Drive's own viewer (PDFs, images, Office files). */
function previewFile(r){

}
const previewUrl = f => 'https:\/\/drive.google.com/file/d/' + encodeURIComponent(f.id) + '/preview';
function previewHtml(r){

/* ---------- popovers (filters, assign) ---------- */
function popHtml(){
  const p = S.pop;
  if (p.type === 'filter') {
    const f = FILTERS.find(x => x.key === p.key);
    const counts = {};
    inMonth().filter(r => passFilters(r, f.key)).forEach(r => { const v = r[f.key] || ''; counts[v] = (counts[v] || 0) + 1; });
    S.f[f.key].forEach(v => { if (!(v in counts)) counts[v] = 0; });
    const q = (p.q || '').toLowerCase();
    const label = v => v ? (f.key === 'owner' ? person(v) : v) : f.empty;
    const opts = Object.keys(counts).filter(v => label(v).toLowerCase().includes(q))
      .sort((a, b) => counts[b] - counts[a] || label(a).localeCompare(label(b)));
    return `<div class="pop" role="dialog" aria-label="Filter by ${f.label}">
      <input type="search" data-pop-q placeholder="Search ${f.label.toLowerCase()}" value="${esc(p.q || '')}">
      <ul class="opts">${opts.map(v => `<li><label><input type="checkbox" class="cb" data-act="fval" data-v="${esc(v)}" ${S.f[f.key].has(v) ? 'checked' : ''}>
        <span class="v" dir="auto">${f.key === 'owner' ? avatar(v) + ' ' : ''}${esc(label(v))}</span><span class="k">${counts[v]}</span></label></li>`).join('') || '<li class="muted" style="padding:8px">No matches</li>'}</ul>
      <div class="pop-foot"><button data-act="fonly">Select shown</button><button data-act="fclear">Clear</button></div></div>`;
  }
  if (p.type === 'months') {
    return `<div class="pop" role="dialog" aria-label="Earlier months"><ul class="opts">${months().slice(1).map(m => `<li><button data-act="month" data-v="${m.key}"><span class="v">${fmtMonth(m.key)}</span>${m.missing ? `<span class="k" style="color:var(--miss);font-weight:600">${m.missing} missing</span>` : `<span class="k" style="color:var(--done)">All in</span>`}</button></li>`).join('')}</ul></div>`;
  }
  if (p.type === 'cols') {
    return `<div class="pop" role="dialog" aria-label="Columns from the Excel file"><div class="hint" style="padding:6px 8px 8px;margin:0">Extra columns from your Excel file</div>
      <ul class="opts">${extraKeys().map(k => `<li><label><input type="checkbox" class="cb" data-act="colval" data-v="${esc(k)}" ${S.cols.has(k) ? 'checked' : ''}><span class="v" dir="auto">${esc(k)}</span></label></li>`).join('')}</ul></div>`;
  }
  if (p.type === 'assign') {
    const q = (p.q || '').toLowerCase();
    const list = people().filter(v => (v + ' ' + person(v)).toLowerCase().includes(q));
    const typed = (p.q || '').trim();
    return `<div class="pop" role="dialog" aria-label="Assign">
      <input type="text" data-pop-q placeholder="Name or email" value="${esc(p.q || '')}" autocomplete="off">
      <ul class="opts">
        ${list.map(v => `<li><button data-act="pick" data-v="${esc(v)}">${avatar(v)}<span class="v">${esc(person(v))}${v === S.user ? ' (you)' : ''}</span></button></li>`).join('')}
        ${typed && !people().includes(typed) ? `<li><button data-act="pick" data-v="${esc(typed)}">${avatar(typed)}<span class="v">Assign to \u201c${esc(typed)}\u201d</span></button></li>` : ''}
        <li><button data-act="pick" data-v=""><span class="av empty">\u2013</span><span class="v">Nobody</span></button></li>
      </ul></div>`;
  }
  return '';
}
function placePop(){
  const el = $('.pop'); const a = S.pop.anchor && document.querySelector(S.pop.anchor);
  if (!el) return;
  const r = a ? a.getBoundingClientRect() : {left:20, bottom:80};
  el.style.left = Math.max(8, Math.min(r.left, innerWidth - el.offsetWidth - 8)) + 'px';
  const top = r.bottom + 6;
  el.style.top = (top + el.offsetHeight > innerHeight - 8 ? Math.max(8, r.top - el.offsetHeight - 6) : top) + 'px';
}
function openPop(pop){ S.pop = pop; renderLayer(); const i = $('[data-pop-q]'); if (i) i.focus(); }
function closePop(){ if (S.pop) { S.pop = null; renderLayer(); } }

function startMock(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const mock = $('.mock'); if (!mock) return;
  const fl = mock.querySelector('.floating'), ring = mock.querySelector('.ring'), txt = mock.querySelector('.mtxt');
  const names = ['netlify-oct.pdf', 'trattoria-receipt.jpg', 'linear-invoice-oct.pdf'];
  let n = 0;
  S.mockTimer = setInterval(() => {
    const rows = [...mock.querySelectorAll('.mrow')];
    const todo = rows.filter(r => r.querySelector('.inv.missing'));
    if (!todo.length) {   // reset the demo
      rows.forEach((r, i) => { if (i !== 2 && i !== 3) { r.classList.remove('hit'); r.querySelector('.inv').outerHTML = `<span class="inv missing">${I.clip}Attach</span>`; } });
      ring.style.setProperty('--p', 62); txt.textContent = '9 of 24 charges still need an invoice'; n = 0; return;
    }
    const row = todo[0], mr = mock.getBoundingClientRect(), rr = row.getBoundingClientRect(), fr = fl.getBoundingClientRect();
    fl.querySelector('b').textContent = names[n % names.length]; n++;
    fl.style.transition = 'none'; fl.style.transform = 'rotate(4deg)'; fl.classList.remove('fly');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fl.style.transition = '';
      fl.style.transform = `translate(${rr.right - fr.right - 10}px, ${rr.top - fr.top - 4}px) rotate(0deg) scale(.9)`;
    }));
    setTimeout(() => {
      fl.classList.add('fly');
      row.querySelector('.inv').outerHTML = `<span class="inv done">${I.check}Invoice</span>`;
      row.classList.remove('hit'); void row.offsetWidth; row.classList.add('hit');
      const left = todo.length - 1; const p = Math.round((24 - (6 + left)) / 24 * 100);
      ring.style.setProperty('--p', Math.min(100, 62 + (3 - left) * 12));
      txt.textContent = left ? `${6 + left} of 24 charges still need an invoice` : '6 of 24 charges still need an invoice';
    }, 950);
  }, 2600);
}

/* ================= actions ================= */
function toast(msg, bad){
  const old = $('.toast'); if (old) old.remove();
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg;
  t.setAttribute('role', bad ? 'alert' : 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), bad ? 7000 : 4200);
}
function replaceRows(list){
  const m = new Map(list.map(r => [r.id, r]));
  S.rows = S.rows.map(r => m.get(r.id) || r);
}
async function load(){
  const timer = setTimeout(() => showFatal('Google took too long to answer. Refresh the page. If it keeps happening, open Executions in the Apps Script editor to see the error.'), 30000);
  try {
    const st = await call('getState');
    clearTimeout(timer);
    Object.assign(S, {loading:false, denied:!!st.denied, appUrl:st.url || null, configured:st.configured, user:st.user, folder:st.folder || null, sheetUrl:st.sheetUrl || null, summary:st.summary || null, team:st.team || [], allowed:st.allowed || [], allowedLocked:!!st.allowedLocked, domain:st.domain || '', rows:st.rows || [], lastLoad:Date.now()});
    render();
    if (st.syncDue) bgSync();
  } catch (e) {
    clearTimeout(timer); showFatal(e.message);
  }
}
// Tidy Drive in the background so the page never waits on it.
function bgSync(){
  call('syncDrive').then(r => { if (r && (r.renamed || r.moved || r.missing)) { S.rows = r.rows; render(); } }).catch(() => {});
}

let attachTarget = null;
const actions = {
  month: el => { S.month = el.dataset.v; S.sel.clear(); S.pop = null; render(); },
  status: el => { S.status = el.dataset.v; renderList(); },
  login: async () => { S.stage = null; S.loading = true; await load(); },
  'mine-toggle': () => { S.mine = !S.mine; render(); },
  sort: el => { const k = el.dataset.v; S.sort = {key:k, dir:S.sort.key === k ? -S.sort.dir : (k === 'date' || k === 'amount' ? -1 : 1)}; renderList(); },
  filter: el => {
    if (S.pop && S.pop.key === el.dataset.v) return closePop();
    openPop({type:'filter', key:el.dataset.v, anchor:`[data-act="filter"][data-v="${el.dataset.v}"]`});
  },
  fval: el => { const set = S.f[S.pop.key]; el.checked ? set.add(el.dataset.v) : set.delete(el.dataset.v); renderList(); renderLayer(); },
  theme: el => { setTheme(el.dataset.v); document.querySelectorAll('[data-act="theme"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === el.dataset.v)); },
  earlier: () => { if (S.pop && S.pop.type === 'months') return closePop(); openPop({type:'months', anchor:'[data-act="earlier"]'}); },

async function bulk(ids, field, value, msg){
  /* Show the change right away, save in the background, undo if the save fails. */
  const month = (S.rows.find(r => r.id === ids[0]) || {}).month, before = missingIn(month), prev = {};
  ids.forEach(id => { const r = S.rows.find(x => x.id === id); if (r) { prev[id] = r[field]; r[field] = value; } });
  toast(msg.replace(/\s+/g, ' '));
  if (field === 'status') { S.sel.clear(); renderLayer(); settle(ids, month, before); } else refresh();
  try { replaceRows(await call('updateMany', ids, field, value)); refresh(); }
  catch (e) { ids.forEach(id => { const r = S.rows.find(x => x.id === id); if (r) r[field] = prev[id]; }); render(); toast(e.message, true); }
}
function refresh(){ renderList(); renderLayer(); }

    if (el.tagName !== 'INPUT' && el.dataset.act !== 'modal-bg') e.preventDefault();

document.addEventListener('keydown', e => {

  }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'noteText') e.target.form.requestSubmit();

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.dataset.form === 'note') {
    const id = f.dataset.id, text = $('#noteText').value.trim();
    if (!text) return;
    try { replaceRows([await call('addNote', id, text)]); S.draft[id] = ''; refresh(); }
    catch (err) { toast(err.message, true); }
  }
  if (f.dataset.form === 'again') {
    const id = f.dataset.id, text = $('#againText').value.trim();
    if (!text) { $('#againText').focus(); return; }
    const r0 = S.rows.find(x => x.id === id), before = missingIn(r0.month);
    try { replaceRows([await call('requestAgain', id, text)]); S.againFor = null; refresh(); toast('Requested again. The charge is back in Missing.'); }
    catch (err) { toast(err.message, true); }
  }
  if (f.dataset.form === 'invno') {
    const r = S.rows.find(x => x.id === f.dataset.id), file = r && r.files.find(x => x.id === f.dataset.file);
    if (!file) return;
    const prev = file.invoiceNo, value = $('#invNoInput').value.trim();
    file.invoiceNo = value; S.editNo = null; renderLayer(); refresh();
    try { replaceRows([await call('setInvoiceNo', r.id, file.id, value)]); toast(value ? `Invoice number saved` : 'Invoice number removed'); }
    catch (err) { file.invoiceNo = prev; renderLayer(); refresh(); toast(err.message, true); }
    return;
  }
  if (f.dataset.form === 'add') {
    const v = id => f.querySelector('#' + id).value;
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    try {
      const r = await call('addCharge', {date:v('addDate'), merchant:v('addVendor'), amount:v('addAmount'), currency:v('addCur'), details:v('addType'), owner:v('addOwner'), note:v('addNote')});
      S.rows.push(r); S.month = r.month; S.status = 'missing'; closeModal(); render(); toast(`Added ${r.merchant}`);
    } catch (err) { f.querySelector('.err').textContent = err.message; btn.disabled = false; }
  }
  if (f.dataset.form === 'access') {
    try { S.allowed = await call('saveAccess', $('#accessText').value); toast('Access saved'); closeModal(); }
    catch (err) { f.querySelector('.err').textContent = err.message; }
  }
  if (f.dataset.form === 'summary') {
    try { S.summary = await call('saveSummary', $('#sumEmail').value, $('#sumOn').checked); toast(S.summary.on ? `Monthly summary goes to ${S.summary.email}` : 'Monthly summary turned off'); closeModal(); }
    catch (err) { f.querySelector('.err').textContent = err.message; }
  }
  if (f.dataset.form === 'folder') {
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    try {
      const at = f.querySelector('#allowText');
      const st = await call('setup', f.querySelector('#folderLink').value, at ? at.value : null);
      Object.assign(S, {configured:true, folder:st.folder, sheetUrl:st.sheetUrl, allowed:st.allowed || S.allowed, rows:st.rows || []});
      S.modal = null; render(); renderLayer(); scrollTo(0, 0); toast('Folder saved');
    } catch (err) { const p = f.querySelector('.err'); p.textContent = err.message; btn.disabled = false; }
  }
});

/* ================= uploads ================= */
const MAX = 25 * 1024 * 1024;
function readB64(file){
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(file); });
}
async function attach(rowId, files){
  files = [...files];
  const month = (S.rows.find(r => r.id === rowId) || {}).month;
  const before = missingIn(month);
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    if (file.size > MAX) { toast(`${file.name} is larger than 25 MB. Compress it and try again.`, true); continue; }
    S.busy.add(rowId); refresh();
    try {
      const row = await call('uploadInvoice', rowId, {name:file.name, type:file.type, data:await readB64(file)});
      S.busy.delete(rowId);
      replaceRows([row]);
      if (i === files.length - 1) toast(`Invoice saved for ${row.merchant}`);
    } catch (e) { S.busy.delete(rowId); refresh(); toast(`${file.name}: ${e.message}`, true); return; }
  }
  settle([rowId], month, before);
}
function missingIn(month){ return S.rows.filter(r => r.month === month && !isDone(r)).length; }
/* Show the change on the rows first (stamp, then slide out of the Missing list), then re-render. */
function settle(ids, month, before){
  const leaving = [];
  ids.forEach(id => {
    const r = S.rows.find(x => x.id === id), tr = document.querySelector(`.tr[data-row="${id}"]`);
    if (!r || !tr) return;
    const cell = tr.querySelector('.c:last-child');
    if (isDone(r)) {
      cell.innerHTML = isLost(r) ? `<span class="inv lost">Lost</span>` : `<span class="inv done">${I.check}${r.files.length ? 'Invoice' : 'Done'}</span>`;
      tr.classList.remove('is-miss'); tr.classList.add('just-done');
      if (S.status === 'missing') leaving.push(tr);
    } else if (S.status === 'done') leaving.push(tr);
  });
  const after = missingIn(month);
  const finish = () => { refresh(); if (before > 0 && after === 0) celebrate(month); };
  if (!leaving.length || matchMedia('(prefers-reduced-motion: reduce)').matches) return setTimeout(finish, leaving.length ? 0 : 50);
  setTimeout(() => { leaving.forEach(tr => tr.classList.add('leaving')); setTimeout(finish, 380); }, 650);
}
function celebrate(month){
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const box = document.createElement('div'); box.className = 'burst'; document.body.appendChild(box);
    for (let i = 0; i < 28; i++) {
      const el = document.createElement('div'); el.innerHTML = LEAF; const svg = el.firstChild;
      const size = 12 + Math.random() * 14; svg.setAttribute('width', size); svg.setAttribute('height', size);
      svg.style.left = (40 + Math.random() * 20) + '%'; svg.style.top = '96px'; box.appendChild(svg);

        if (head) { if (rename[head] || !/^#$|^\u05de\u05e1'?$|^no\.?$/i.test(head)) extra[rename[head] || head] = s; }
        else if (isNaN(Number(s))) notes.push(s);
      });
      const base = [month, date, merchant.toLowerCase().replace(/\s+/g, ' '), amount.toFixed(2), currency].join('|');
      seen[base] = (seen[base] || 0) + 1;
      rows.push({key:base + '#' + seen[base], month, date, merchant, amount, currency, charged,
        chargedCurrency:idx.chargedCurrency != null ? normCur(r[idx.chargedCurrency]) : '',
        details:idx.details != null ? String(r[idx.details]).trim() : '',
        owner:idx.owner != null ? String(r[idx.owner]).trim() : '', status, note:notes.join('\n'), extra});
      months[month] = (months[month] || 0) + 1;
      perSheet[si] = (perSheet[si] || 0) + 1;
    }
  });
  return {rows, months, perSheet, preview:rows.slice(0, 4), missingCore:!rows.length && (!choice.merchant || !choice.amount)};
}

/* ================= auto-match invoices ================= */
const STOP = new Set(['pending','com','inc','ltd','llc','trip','help','the','www','sumup','revolut','me','co','bkg','gmbh','srl','spa','sub','retail','pay','paypal']);
function numbersIn(t){
  const set = new Set();
  (t.match(/\d[\d,.]*[.,]\d{2}(?!\d)|\b\d+\b/g) || []).forEach(s => { const n = num(s); if (n != null) set.add(n.toFixed(2)); });
  return set;
}
function scoreRow(r, text, nums){
  let score = 0; const why = [];
  const lower = text.toLowerCase();
  if (r.amount != null && nums.has(Number(r.amount).toFixed(2))) { score += 60; why.push('amount'); }
  else if (r.charged != null && r.charged !== '' && nums.has(Number(r.charged).toFixed(2))) { score += 50; why.push('charged amount'); }
  const tokens = r.merchant.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w => w.length >= 3 && !STOP.has(w) && !/^\d+$/.test(w));
  if (tokens.some(w => lower.includes(w))) { score += 30; why.push('vendor'); }
  const x = /^(\d{4})-(\d{2})-(\d{2})$/.exec(r.date || '');
  if (x) {
    const [, y, m, d] = x, yy = y.slice(2);
    const forms = [`${d}/${m}/${y}`, `${d}.${m}.${y}`, `${d}/${m}/${yy}`, `${d}.${m}.${yy}`, `${y}-${m}-${d}`, `${m}/${d}/${y}`, `${+d}/${+m}/${y}`];
    if (forms.some(f => text.includes(f))) { score += 12; why.push('date'); }
  }
  return {row:r, score, why};
}
/* Drop invoices anywhere: each one is saved to Drive, read, and attached when Oak is sure of the charge. */
async function autoSort(files){
  files = [...files].filter(f => f.size <= MAX || (toast(`${f.name} is larger than 25 MB. Compress it and try again.`, true), false));
  if (!files.length) return;
  const sure = [], review = [], taken = new Set();
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    working(`Reading ${files.length === 1 ? 'the invoice' : `invoice ${i + 1} of ${files.length}`}\u2026`, i / files.length);
    try {
      const staged = await call('stageFile', {name:file.name, type:file.type, data:await readB64(file)});
      const read = await call('readInvoice', staged.id);
      const item = {name:file.name, url:staged.url, fileId:staged.id, invoiceNo:read.invoiceNo, text:file.name.replace(/[_\-]+/g, ' ') + ' ' + read.text};
      item.dup = sameInvoice(item);
      const best = !item.dup && sureMatch(item.text, taken);
      if (best) { taken.add(best.id); sure.push([item, best.id]); } else review.push(item);
    } catch (e) { toast(`${file.name}: ${e.message}`, true); }
  }
  working('');
  for (const [item, rowId] of sure) await attachStaged(item, rowId);
  if (sure.length && !review.length) toast(`${sure.length} ${sure.length === 1 ? 'invoice' : 'invoices'} attached`);
  if (review.length) matchDialog(review.map(it => ({...it, getText:async () => it.text, attach:rowId => attachStaged(it, rowId)})),
    `${sure.length ? `Oak attached ${sure.length}. ` : ''}Pick the charge for ${review.length === 1 ? 'this one' : 'these'}. Files you don't attach stay in the Drive folder.`);
}
function copyText(text){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).catch(() => copyByHand(text));
  return copyByHand(text);
}
function copyByHand(text){
  const t = document.createElement('textarea'); t.value = text; t.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(t); t.select();
  const ok = document.execCommand('copy'); t.remove();
  return ok ? Promise.resolve() : Promise.reject(new Error('copy failed'));
}
function working(msg, frac){
  let p = $('#working');
  if (!msg) return p && p.remove();
  if (!p) {
    p = document.createElement('div'); p.id = 'working'; p.setAttribute('role', 'status');
    p.innerHTML = '<div class="w-top"><span class="w-msg"></span><span class="w-pct"></span></div><div class="w-bar"><i></i></div>';
    document.body.appendChild(p);
  }
  const known = frac != null;
  p.classList.toggle('indet', !known);
  p.querySelector('.w-msg').textContent = msg;
  p.querySelector('.w-pct').textContent = known ? Math.round(frac * 100) + '%' : '';
  p.querySelector('.w-bar i').style.width = known ? frac * 100 + '%' : '';
}
/* Attach when one charge clearly wins: same amount, plus the vendor or the date. */
function sureMatch(text, taken){
  const nums = numbersIn(text);
  const c = S.rows.filter(r => !isDone(r) && !taken.has(r.id)).map(r => scoreRow(r, text, nums)).sort((a, b) => b.score - a.score);
  return c[0] && c[0].score >= 72 && c[0].why.includes('amount') && (!c[1] || c[1].score < c[0].score) ? c[0].row : null;
}
/* An invoice number that's already on a charge with the same vendor or amount: the same invoice, uploaded twice. */
function sameInvoice(item){
  if (!item.invoiceNo) return null;
  const nums = numbersIn(item.text);
  return S.rows.find(r => r.files.some(f => !f.rejected && f.invoiceNo === item.invoiceNo) && scoreRow(r, item.text, nums).score >= 30) || null;
}
async function attachStaged(item, rowId){
  const month = (S.rows.find(r => r.id === rowId) || {}).month, before = missingIn(month);
  try { replaceRows([await call('attachExisting', rowId, item.fileId, item.invoiceNo || '')]); settle([rowId], month, before); }
  catch (e) { toast(`${item.name}: ${e.message}`, true); }
}
/* Files that are already in the Drive folder: suggest a charge for each, attach without re-uploading. */
async function startDriveMatch(){
  closeModal(); toast('Looking through the Drive folder\u2026');
  let files;
  try { files = await call('listLooseFiles'); } catch (e) { return toast(e.message, true); }
  if (!files.length) return toast('Every file in the folder is already attached to a charge.');
  return matchDialog(files.map(f => {
    const it = {name:f.name, url:f.url, fileId:f.id, invoiceNo:''};
    it.getText = async () => { try { const r = await call('readInvoice', f.id); it.invoiceNo = r.invoiceNo; return f.name.replace(/[_\-]+/g, ' ') + ' ' + r.text; } catch (e) { return f.name; } };
    it.attach = rowId => attachStaged(it, rowId);
    return it;
  }), `Found ${files.length} ${files.length === 1 ? 'file' : 'files'} in the folder that aren't attached yet. Matched files are renamed and moved to their month folder. The rest stay where they are.`);
}
async function matchDialog(items, intro){
  items.forEach(it => { it.cands = []; it.choice = ''; it.why = ''; });
  let reading = true, done = 0;
  const missing = () => S.rows.filter(r => !isDone(r)).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const label = r => `${fmtDate(r.date)}  ${r.merchant}  ${money(r.amount, r.currency)}${S.month === 'all' || r.month === S.month ? '' : '  (' + fmtMonth(r.month) + ')'}`;
  const nChosen = () => items.filter(it => it.choice).length;
  const html = () => `<header><h2>Match ${items.length} ${items.length === 1 ? 'invoice' : 'invoices'}</h2>
      <p>${reading ? `Reading files\u2026 ${done} of ${items.length}` : intro}</p></header>
    <div class="body">${items.map((it, i) => `<div class="match"><div class="fname" dir="auto">${it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.name)}</a>` : esc(it.name)}</div>
      ${it.read ? `<select data-match="${i}" aria-label="Charge for ${esc(it.name)}">
        <option value="">Don't attach</option>
        ${it.cands.length ? `<optgroup label="Best matches">${it.cands.map(c => `<option value="${c.row.id}" ${it.choice === c.row.id ? 'selected' : ''}>${esc(label(c.row))}</option>`).join('')}</optgroup>` : ''}
        <optgroup label="All missing charges">${missing().filter(r => !it.cands.some(c => c.row.id === r.id)).map(r => `<option value="${r.id}" ${it.choice === r.id ? 'selected' : ''}>${esc(label(r))}</option>`).join('')}</optgroup>
      </select><div class="why ${it.why ? 'good' : ''}">${it.dup ? `Invoice ${esc(it.invoiceNo)} is already attached to ${esc(it.dup.merchant)}.` : it.why ? 'Matched on ' + it.why : 'No clear match. Pick the charge yourself.'}</div>` : '<span class="muted"><span class="spin" style="display:inline-block;vertical-align:-2px;margin-right:6px"></span>Reading</span>'}</div>`).join('')}</div>
    <footer><button class="btn" data-act="modal-close">Cancel</button>
      <button class="btn primary" data-act="modal-ok" ${reading || !nChosen() ? 'disabled' : ''}>Attach ${nChosen() || ''} ${nChosen() === 1 ? 'invoice' : 'invoices'}</button></footer>`;
  showModal(html, async () => {
    const todo = items.filter(it => it.choice); closeModal();
    for (let k = 0; k < todo.length; k++) { toast(`Attaching ${k + 1} of ${todo.length}\u2026`); await todo[k].attach(todo[k].choice); }
    if (todo.length) toast(`${todo.length} ${todo.length === 1 ? 'invoice' : 'invoices'} attached`);
  });
  document.getElementById('layer').onchange = e => {
    if (e.target.dataset.match != null) { const it = items[+e.target.dataset.match]; it.choice = e.target.value; it.why = ''; renderLayer(); }
  };
  const taken = new Set();
  for (const it of items) {
    const text = await it.getText(), nums = numbersIn(text);
    it.cands = missing().map(r => scoreRow(r, text, nums)).filter(c => c.score >= 30).sort((a, b) => b.score - a.score).slice(0, 6);
    const best = it.cands.find(c => !taken.has(c.row.id));
    if (!it.dup && best && best.score >= 60 && (!it.cands[1] || best.score > it.cands[1].score || best !== it.cands[0])) {
      it.choice = best.row.id; it.why = best.why.join(', '); taken.add(best.row.id);
    }
    it.read = true; done++;
    if (S.modal) renderLayer();
  }
  reading = false; if (S.modal) renderLayer();
}
